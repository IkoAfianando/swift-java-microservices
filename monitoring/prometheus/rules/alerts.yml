groups:
  - name: microservices_alerts
    rules:
      - alert: HighErrorRate
        expr: |
          sum(rate(http_server_requests_seconds_count{status=~"5.."}[5m]))
          /
          sum(rate(http_server_requests_seconds_count[5m])) > 0.05
        for: 2m
        labels:
          severity: warning
        annotations:
          summary: "High error rate on {{ $labels.job }}"
          description: "Error rate is {{ $value | humanizePercentage }} over last 5 min"

      - alert: HighLatencyP95
        expr: |
          histogram_quantile(0.95,
            sum(rate(http_server_requests_seconds_bucket[5m])) by (le, job)
          ) > 1.0
        for: 3m
        labels:
          severity: warning
        annotations:
          summary: "P95 latency > 1s on {{ $labels.job }}"
          description: "P95 latency is {{ $value }}s"

      - alert: ServiceDown
        expr: up == 0
        for: 1m
        labels:
          severity: critical
        annotations:
          summary: "Service {{ $labels.job }} is down"
          description: "Target {{ $labels.instance }} is not responding"

      - alert: HighMemoryUsage
        expr: |
          (container_memory_usage_bytes{name=~"(swift|java)-.*"} /
           container_spec_memory_limit_bytes{name=~"(swift|java)-.*"}) > 0.85
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: "High memory usage in container {{ $labels.name }}"
          description: "Memory usage is {{ $value | humanizePercentage }}"
